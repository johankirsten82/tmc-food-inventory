<style>

.st{padding:3px 8px;border-radius:10px;font-size:12px;font-weight:700;color:#fff}.st.ok{background:#16a34a}.st.re{background:#dc2626}

</style></head><body>

let L=localStorage.lang||"en";const t=k=>(T[L]||T.en)[k]||T.en[k]||k;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const S={recs:{},dirty:{},cfg:Object.assign({url:SYNC_URL},JSON.parse(localStorage.cfg||"{}")),me:localStorage.me||"",dev:localStorage.dev||(localStorage.dev=uid()),tab:"home",k:localStorage.k||STORE};
/* IndexedDB: one store "r" keyed by kind:id, same record shape as _Records */
let db;function idb(){return new Promise((ok,no)=>{const q=indexedDB.open("food-inv",1);q.onupgradeneeded=()=>q.result.createObjectStore("r",{keyPath:"key"});q.onsuccess=()=>{db=q.result;ok()};q.onerror=no})}
function loadAll(){return new Promise(ok=>{const q=db.transaction("r").objectStore("r").getAll();q.onsuccess=()=>{q.result.forEach(r=>S.recs[r.key]=r);ok()}})}
function put(kind,id,data,del){const r={key:kind+":"+id,kind,id,u:Date.now(),del:del?1:0,data,dirty:1};S.recs[r.key]=r;db.transaction("r","readwrite").objectStore("r").put(r);schedSync()}
const all=k=>Object.values(S.recs).filter(r=>r.kind===k&&!r.del&&r.data).map(r=>r.data);
const items=k=>all("i").filter(i=>!k||i.kitchen===k).sort((a,b)=>a.name.localeCompare(b.name));
/* qty = sum of movements: in +, use -, transfer - from / + to. Conflict-free across phones. */
function qtyOf(i){let q=0;all("m").forEach(m=>{if(m.item===i.id)q+=m.type==="in"?+m.qty:-m.qty;if(m.type==="xfer"&&m.toItem===i.id)q+=+m.qty});return Math.round(q*1000)/1000}
const low=i=>qtyOf(i)<=(+i.rl||0),buyQty=i=>Math.max(0,Math.round(((+i.rl||0)*2-qtyOf(i))*1000)/1000);
const users=()=>all("u"),meU=()=>users().find(u=>u.id===S.me),isAdmin=()=>meU()?.role==="admin"&&meU()?.status==="ok";
function toast(s){const e=$("#toast");e.textContent=s;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",1800)}

function go(tab){S.tab=tab;render()}
function render(){document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";$("#lang").value=L;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 const u=meU();$("#chip").textContent=u?"👤 "+u.name+(u.role==="admin"?" ⭐":""):"";
 if(!u||u.status!=="ok"){$("#nav").innerHTML="";$("#m").innerHTML=u?`<div class="card" style="text-align:center"><h2>⏳</h2><p>${t("wait")}</p><button onclick="sync()">${t("syncnow")}</button></div>${syncCard()}`:`<div class="card"><h2>👋 ${t("app")}</h2><label>${t("name")}</label><input id="nm"><p></p><button style="width:100%" onclick="signup()">${t("start")}</button></div>${syncCard()}`;return}
 const lowN=items().filter(low).length,tabs=[["home","🏠"],["stock","📦"],["move","🔄"],["shop","🛒",lowN],["users","👥"],["reports","📊"]].filter(x=>x[0]!=="users"||isAdmin());
 $("#nav").innerHTML=tabs.map(([k,e,b])=>`<a href="#" class="${S.tab===k||(k==="move"&&/incoming|recv|xfer/.test(S.tab))?"on":""}" onclick="go('${k}');return false">${e}<br>${t(k)} ${b?`<span class="badge">${b}</span>`:""}</a>`).join("");
 $("#m").innerHTML=V[S.tab]();window.scrollTo(0,0)}
async function signup(){const n=$("#nm").value.trim();if(!n)return;const c=$("#sc")?.value.trim();if(c){S.cfg={url:$("#su").value.trim()||SYNC_URL,code:c,since:0};localStorage.cfg=JSON.stringify(S.cfg)}if(S.cfg.code)await sync();const id=uid(),first=!users().length;put("u",id,{id,name:n,status:first?"ok":"wait",role:first?"admin":"user",at:new Date().toISOString()});S.me=localStorage.me=id;render()}
function syncCard(){return `<div class="card"><b>☁️ ${t("sync")}</b><label>${t("code")}</label><input id="sc" type="password" autocomplete="off" value="${esc(S.cfg.code||"")}"><details style="margin-top:8px"><summary class="sm">⚙️ ${t("url")}</summary><input id="su" dir="ltr" value="${esc(S.cfg.url||SYNC_URL)}"></details><p></p><button onclick="S.cfg={url:$('#su').value.trim()||SYNC_URL,code:$('#sc').value.trim(),since:0};localStorage.cfg=JSON.stringify(S.cfg);sync()">${t("syncnow")}</button> <span class="sm">${t("version")} ${VER}</span></div>`}
const V={
home(){const tiles=LOCS.map(k=>{const it=items(k),l=it.filter(low).length,st=k===STORE,ni=st?openInc().length:0;return `<div class="tile ${l?"bad":""}" ${st?'style="grid-column:1/-1"':""} onclick="S.k=localStorage.k='${k}';go('stock')"><div style="font-size:34px">${st?"🏬":"🍽️"}</div>${st&&ni?`<div class="sm" style="color:#b45309;font-weight:700">🚚 ${ni} ${t("incoming")}</div>`:""}${st&&isAdmin()&&openShort().length?`<div style="margin:6px 0"><span class="st re" style="font-size:14px;padding:5px 12px" onclick="event.stopPropagation();go('short')">⚠ ${openShort().length} ${t("shortb")}</span></div>`:""}<b>${t(k)}</b><div class="big">${l}</div><div class="sm">${t("reorder")} · ${it.length} ${t("items")}</div>${st?`<p></p><button style="width:100%;font-size:18px" onclick="event.stopPropagation();startXfer('${STORE}')">🔁 ${t("xferbig")}</button>`:""}</div>`}).join("");
 return `<div class="card row"><img src="icons/icon-192.png" style="max-width:56px;border-radius:12px"><div style="flex:4"><b style="font-size:20px">${t("app")}</b><div class="sm">${new Date().toLocaleDateString(L,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div></div></div><div class="tiles">${tiles}</div><p></p><div class="card sm" style="text-align:center">${S.cfg.url&&S.cfg.code?"☁️ "+t("sync")+": "+(S.last?new Date(S.last).toLocaleString(L):"—"):t("syncoff")} · ${VER}</div>`},
stock(){const it=items(S.k),f=(S.q||"").toLowerCase();
 return `<div class="card">${kSel("ks",S.k)}<p></p><input id="q" placeholder="${t("search")}" value="${esc(S.q||"")}" oninput="S.q=this.value;$('#tb').innerHTML=stockRows()"><p></p><button onclick="itemForm()">${t("add")}</button> ${S.k===STORE?`<button style="background:#b45309" onclick="go('incoming')">🚚 ${t("incoming")} (${openInc().length})</button>`:""}</div><div class="card"><table><tr><th>${t("item")}</th><th>${t("qty")}</th><th>${t("rl")}</th><th>${t("status")}</th></tr><tbody id="tb">${stockRows()}</tbody></table></div><div id="frm"></div>`},
move(){const isS=S.k===STORE,segs=isS?["in","xfer"]:["use","xfer"],ty=segs.includes(S.mt)?S.mt:segs[0],it=items(S.k),ms=all("m").filter(m=>m.kitchen===S.k||m.to===S.k).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,15),nm=id=>(all("i").find(i=>i.id===id)||{}).name||"?";
 return `<div class="card">${kSel("ks",S.k)}<p></p><button style="width:100%;margin-bottom:10px;font-size:18px" onclick="startXfer(S.k)">🔁 ${t(isS?"xferbig":"xferk")}</button>${isS?`<button style="width:100%;margin-bottom:10px;background:#b45309" onclick="go('incoming')">🚚 ${t("incoming")} (${openInc().length})</button>`:`<p class="sm">ℹ️ ${t("kinfo")}</p>`}<div class="seg">${segs.map(x=>`<button class="${ty===x?"":"alt"}" onclick="S.mt='${x}';render()">${t({in:"recv",use:"use",xfer:"xfer"}[x])}</button>`).join("")}</div>
 ${it.length?`<label>${t("item")}</label><select id="mi">${it.map(i=>`<option value="${i.id}">${esc(i.name)} (${qtyOf(i)} ${esc(i.unit)})</option>`).join("")}</select><label>${t("qty")}</label><input id="mq" type="number" inputmode="decimal" step="any">${ty==="xfer"?`<label>${t("to")}</label>${kSel("mto",KITCHENS.find(k=>k!==S.k))}`:""}<label>${t("note")}</label><input id="mn"><p></p><button style="width:100%" onclick="saveMove()">${t("save")}</button>`:`<p>${t("none")}</p>`}</div>
 <div class="card"><b>${t("recent")}</b><table>${ms.map(m=>`<tr><td>${m.type==="in"?"📥":m.type==="use"?"🍳":"🔁"} ${esc(nm(m.item))}</td><td>${m.type==="in"||(m.type==="xfer"&&m.to===S.k)?"+":"−"}${m.qty}</td><td class="sm">${new Date(m.at).toLocaleString(L,{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} ${esc(m.by)}${m.type==="xfer"?"<br>"+esc(m.kitchen)+" → "+esc(m.to):""}</td></tr>`).join("")||`<tr><td>${t("none")}</td></tr>`}</table></div>`},
shop(){const ks=S.shopK===undefined?S.k:S.shopK,list=items(ks||null).filter(low);
 return `<div class="card">${kSel("shk",ks,1)}</div><div class="card">${list.length?`<table><tr><th>${t("item")}</th><th>${t("qty")}</th><th>${t("buy")}</th><th>${t("sup")}</th></tr>${list.map(i=>`<tr><td>${esc(i.name)}${ks?"":`<br><span class="sm">${esc(i.kitchen)}</span>`}</td><td>${qtyOf(i)}</td><td><b>${buyQty(i)} ${esc(i.unit)}</b></td><td class="sm">${esc(i.supplier)}</td></tr>`).join("")}</table><p></p><button onclick="shareList()">${t("print")}</button>`:t("nolow")}</div>`},
users(){return `<div class="card"><table>${users().map(u=>`<tr><td>${esc(u.name)}<br><span class="sm">${u.role==="admin"?"⭐ "+t("admin"):""} ${u.status}</span></td><td>${u.id===S.me?"":`${u.status!=="ok"?`<button onclick="setU('${u.id}','ok')">${t("approve")}</button>`:""} ${u.status!=="blocked"?`<button class="red" onclick="setU('${u.id}','blocked')">${t("block")}</button>`:""} ${u.status==="ok"&&u.role!=="admin"?`<button class="alt" onclick="setU('${u.id}','ok','admin')">⭐</button>`:""}`}</td></tr>`).join("")}</table></div>${syncCard()}`},
reports(){const since=new Date(Date.now()-30*864e5).toISOString(),ms=all("m").filter(m=>m.at>=since),I={};all("i").forEach(i=>I[i.id]=i);
 const sum=type=>{const o={};ms.filter(m=>m.type===type).forEach(m=>{const i=I[m.item];if(!i)return;const k=i.kitchen+"|"+i.name+"|"+i.unit;o[k]=(o[k]||0)+ +m.qty});return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,15)};
 const tb=rows=>rows.length?`<table>${rows.map(([k,v])=>{const[kk,n,u]=k.split("|");return `<tr><td>${esc(n)}<br><span class="sm">${esc(kk)}</span></td><td><b>${Math.round(v*1000)/1000} ${esc(u)}</b></td></tr>`}).join("")}</table>`:t("none");

const openShort=()=>all("shortage").filter(z=>z.status==="open"&&z.short>0).sort((a,b)=>b.at.localeCompare(a.at));
const openInc=()=>all("incoming").filter(n=>n.status!=="received").sort((a,b)=>String(a.paidDate).localeCompare(b.paidDate));
const incSt=n=>`<span class="st" style="background:${n.status==="part"?"#d97706":n.status==="received"?"#16a34a":"#64748b"}">${t(n.status||"open")}</span>`;
function incoming(){const L2=all("incoming").sort((a,b)=>(a.status==="received")-(b.status==="received")||String(b.paidDate).localeCompare(a.paidDate));
 return `<div class="card"><b style="font-size:18px">🏬 ${t("Store Room")} · 🚚 ${t("incoming")}</b><p class="sm">From TMC Sahara Purshes (paid purchases)</p><button style="width:100%;background:#b45309" onclick="startRecv()">${t("recvdel")}</button><p></p><div class="row"><button class="alt" onclick="go('move')">${t("back")}</button>${isAdmin()?`<button class="alt" onclick="loadSample()">${t("sample")}</button>`:""}</div></div>
 <div class="card">${L2.length?`<table><tr><th>${t("item")}</th><th>${t("qty")}</th><th>${t("paid")}</th><th>${t("status")}</th></tr>${L2.map(n=>`<tr><td>${esc(n.item)}${n.size?" · "+esc(n.size):""}<br><span class="sm">${t("boughtby")}: ${esc(n.by)} · ${t("batch")} ${esc(n.batch)}</span></td><td>${isAdmin()?`<b>${n.qty}</b> `:""}${esc(n.unit)}${isAdmin()&&n.recvQty?`<br><span class="sm">${t("got")} ${n.recvQty}</span>`:""}</td><td class="sm">${esc(n.paidDate)}</td><td>${incSt(n)}</td></tr>`).join("")}</table>`:t("none")}</div>`}
function loadSample(){const d=new Date().toISOString().slice(0,10),b="B-"+d.replace(/-/g,"").slice(2);[["Rice","25 kg bag",4,"bag"],["Cooking oil","5 L",6,"jerrican"],["Sugar","1 kg",20,"kg"],["Tomato paste","400 g",24,"tin"],["Onions","",30,"kg"]].forEach(([item,size,qty,unit],i)=>{const id="p-sample-"+b+"-"+i;put("incoming",id,{id,item,size,qty,unit,paidDate:d,by:"Ali",batch:b,status:"open",recvQty:0,src:"sample"})});toast("🧪 5");render()}
function startRecv(){S.rv={lines:openInc().map(n=>({inc:n.id,item:n.item,size:n.size,unit:n.unit,exp:Math.max(0,n.qty-(n.recvQty||0)),qty:"",note:""})),driver:"",veh:""};go("recv")}
function recvView(){const r=S.rv;if(!r)return incoming();
 return `<div class="card"><b style="font-size:18px">${t("recvdel")}</b><p class="sm">🙈 ${t("blind")}</p><label>${t("driver")}</label><input value="${esc(r.driver)}" oninput="S.rv.driver=this.value" id="rd"><label>${t("vehicle")}</label><input value="${esc(r.veh)}" oninput="S.rv.veh=this.value"></div>
 ${r.lines.map((l,i)=>`<div class="card">${l.inc?`<b>${esc(l.item)}</b> ${l.size?`<span class="sm">${esc(l.size)}</span>`:""}<div class="sm">${t("unit")}: ${esc(l.unit)}</div>`:`<div class="row"><input placeholder="${t("item")}" value="${esc(l.item)}" oninput="S.rv.lines[${i}].item=this.value"><input style="max-width:90px" placeholder="${t("unit")}" value="${esc(l.unit)}" oninput="S.rv.lines[${i}].unit=this.value"></div><div class="sm">➕ ${t("extra")}</div>`}
 <div class="row"><div><label>${t("got")}</label><input type="number" step="any" inputmode="decimal" value="${l.qty}" id="rq${i}" placeholder="?" oninput="S.rv.lines[${i}].qty=this.value;this.style.borderColor=''"></div></div><label>${t("note")}</label><input value="${esc(l.note)}" oninput="S.rv.lines[${i}].note=this.value"></div>`).join("")}
 <div class="card"><button class="alt" style="width:100%" onclick="S.rv.lines.push({item:'',unit:'kg',exp:0,qty:'',note:''});render()">${t("addextra")}</button><p></p><button style="width:100%" onclick="confirmRecv()">${t("confirm")}</button><p></p><button class="alt" onclick="S.rv=null;go('incoming')">${t("back")}</button></div>`}
function diffTxt(l){if(!l.inc)return "";const d=Math.round((+l.qty-l.exp)*1000)/1000;return d<0?`<span style="color:#dc2626;font-weight:700">${d} ${t("short")}</span>`:d>0?`<span style="color:#b45309;font-weight:700">+${d} ${t("extra")}</span>`:`<span style="color:#16a34a;font-weight:700">✔</span>`}
function confirmRecv(){const r=S.rv;if(!r.driver.trim()){toast("⚠️ "+t("driver"));$("#rd").focus();return}
 const miss=r.lines.findIndex(l=>(l.inc||(l.item||"").trim())&&String(l.qty).trim()==="");if(miss>=0){toast("⚠️ "+t("fillall"));const e=$("#rq"+miss);e.style.borderColor="#dc2626";e.focus();return}
 const at=new Date().toISOString(),did=uid(),lines=[];
 r.lines.forEach(l=>{const q=+l.qty||0,name=(l.item||"").trim();if(!name||(!l.inc&&q<=0))return;
  if(q>0){let it=items(STORE).find(i=>i.name.toLowerCase()===name.toLowerCase());if(!it){it={id:uid(),kitchen:STORE,name,cat:"Other",unit:l.unit||"",rl:0,supplier:""};put("i",it.id,it)}
   const mid=uid();put("m",mid,{id:mid,type:"in",kitchen:STORE,item:it.id,qty:q,at,by:meU().name,note:"delivery "+did+(l.note?" · "+l.note:""),delivery:did})}
  if(l.inc){const n=all("incoming").find(x=>x.id===l.inc),tot=(+n.recvQty||0)+q;put("incoming",n.id,{...n,recvQty:tot,status:tot>=n.qty?"received":tot>0?"part":"open",lastDelivery:did});
   const sid="s-"+n.id.replace(/^p-/,""),old=all("shortage").find(z=>z.id===sid),sh=Math.round(Math.max(0,n.qty-tot)*1000)/1000;
   if(sh>0||old)put("shortage",sid,{id:sid,purchaseId:n.id.replace(/^p-/,""),item:n.item,size:n.size||"",unit:n.unit||"",short:sh,expected:n.qty,received:tot,batch:n.batch||"",driver:r.driver.trim(),date:at.slice(0,10),at,delivery:did,status:sh>0?"open":"resolved"})}
  lines.push({inc:l.inc||"",item:name,unit:l.unit,expected:l.inc?l.exp:0,qty:q,note:l.note,extra:!l.inc})});
 if(!lines.length)return;put("d",did,{id:did,at,driver:r.driver.trim(),vehicle:r.veh.trim(),by:meU().name,lines});S.rv=null;toast(t("saved"));go("incoming")}
function delivHist(){const D=all("d").sort((a,b)=>b.at.localeCompare(a.at)).slice(0,20);return `<div class="card"><b>🚚 ${t("deliveries")}</b>${D.length?D.map(d=>`<div style="border-top:1px solid #e2e8f0;padding:8px 0"><b>${new Date(d.at).toLocaleString(L,{dateStyle:"medium",timeStyle:"short"})}</b><div class="sm">${t("driver")}: ${esc(d.driver)}${d.vehicle?" · "+esc(d.vehicle):""} · ${t("got")}: ${esc(d.by)}</div>${d.lines.map(l=>`<div class="sm">• ${esc(l.item)}: <b>${l.qty}</b> ${esc(l.unit)}${l.extra?" ("+t("extra")+")":!isAdmin()?"":l.qty<l.expected?` <span style="color:#dc2626">(${t("expected")} ${l.expected}, ${Math.round((l.expected-l.qty)*1000)/1000} ${t("short")})</span>`:l.qty>l.expected?` <span style="color:#b45309">(${t("expected")} ${l.expected})</span>`:""}${l.note?" — "+esc(l.note):""}</div>`).join("")}</div>`).join(""):`<p>${t("none")}</p>`}</div>`}
function startXfer(from){S.xf={from,to:"",lines:[{item:"",qty:""}]};S.k=localStorage.k=from;go("xfer")}
function xferView(){const x=S.xf;if(!x)return V.move();const it=items(x.from),dests=LOCS.filter(k=>k!==x.from&&k!==STORE);
 return `<div class="card"><b style="font-size:18px">${t("xfer")}</b><label>${t("from")}</label><div style="font-weight:700;padding:6px 0">${x.from===STORE?"🏬":"🍽️"} ${t(x.from)}</div><label>${t("to")}</label><div class="seg" style="flex-wrap:wrap">${dests.map(k=>`<button style="flex:1 1 45%" class="${x.to===k?"":"alt"}" onclick="S.xf.to='${k}';render()">🍽️ ${t(k)}</button>`).join("")}</div></div>
 ${x.lines.map((l,i)=>{const sel=it.find(z=>z.id===l.item),over=sel&&+l.qty>qtyOf(sel);return `<div class="card"><div class="row"><select style="flex:3" onchange="S.xf.lines[${i}].item=this.value;render()"><option value="">${t("item")}…</option>${it.map(z=>`<option value="${z.id}" ${z.id===l.item?"selected":""} ${qtyOf(z)<=0?"disabled":""}>${esc(z.name)} (${qtyOf(z)} ${esc(z.unit)})</option>`).join("")}</select><input id="xq${i}" style="flex:1.3" type="number" step="any" inputmode="decimal" placeholder="${t("qty")}" value="${esc(l.qty)}" oninput="S.xf.lines[${i}].qty=this.value;xChk(${i})">${x.lines.length>1?`<button class="alt" style="flex:0 0 44px;padding:10px" onclick="S.xf.lines.splice(${i},1);render()">✖</button>`:""}</div><div class="sm" id="xw${i}" style="margin-top:4px;${over?"color:#dc2626;font-weight:700":""}">${sel?(over?"⚠️ "+t("toomuch")+": ":"")+qtyOf(sel)+" "+esc(sel.unit)+" "+t("inst"):""}</div></div>`}).join("")}
 <div class="card"><button class="alt" style="width:100%" onclick="S.xf.lines.push({item:'',qty:''});render()">${t("addline")}</button><p></p><button style="width:100%" onclick="saveXfer()">✅ ${t("save")}</button><p></p><button class="alt" onclick="S.xf=null;go('move')">${t("back")}</button></div>`}
function xChk(i){const l=S.xf.lines[i],sel=all("i").find(z=>z.id===l.item),e=$("#xw"+i);if(!sel)return;const over=+l.qty>qtyOf(sel);e.style.color=over?"#dc2626":"";e.style.fontWeight=over?"700":"";e.textContent=(over?"⚠️ "+t("toomuch")+": ":"")+qtyOf(sel)+" "+sel.unit+" "+t("inst")}
function saveXfer(){const x=S.xf;if(!x.to){toast("⚠️ "+t("to"));return}const ls=x.lines.filter(l=>l.item&&+l.qty>0);if(!ls.length){toast("⚠️ "+t("qty"));return}
 const tot={};ls.forEach(l=>tot[l.item]=(tot[l.item]||0)+ +l.qty);
 for(const id in tot){const i=all("i").find(z=>z.id===id);if(tot[id]>qtyOf(i)+1e-9){toast("⚠️ "+t("toomuch")+": "+i.name+" ("+qtyOf(i)+" "+i.unit+")");return}}
 const at=new Date().toISOString(),xid=uid();
 ls.forEach(l=>{const src=all("i").find(z=>z.id===l.item);let d=items(x.to).find(i=>i.name.toLowerCase()===src.name.toLowerCase());if(!d){d={...src,id:uid(),kitchen:x.to};put("i",d.id,d)}
  const mid=uid();put("m",mid,{id:mid,type:"xfer",kitchen:x.from,item:src.id,qty:+l.qty,to:x.to,toItem:d.id,at,by:meU().name,note:"",xfer:xid})});
 S.k=localStorage.k=x.from;S.xf=null;toast("🔁 "+ls.length+" → "+t(x.to));go("move")}
function shortView(){if(!isAdmin())return V.home();const A=all("shortage").sort((a,b)=>(a.status!=="open")-(b.status!=="open")||b.at.localeCompare(a.at));
 return `<div class="card"><b style="font-size:18px">⚠ ${t("shortages")}</b><p class="sm">${t("shortinfo")}</p><button class="alt" onclick="go('reports')">${t("back")}</button></div><div class="card">${A.length?`<table><tr><th>${t("item")}</th><th>${t("shortb")}</th><th>${t("driver")}</th><th>${t("status")}</th></tr>${A.map(z=>`<tr><td><b>${esc(z.item)}</b>${z.size?" · "+esc(z.size):""}<br><span class="sm">${t("batch")} ${esc(z.batch)} · #${esc(z.purchaseId)}<br>${t("got")} ${z.received}/${z.expected} ${esc(z.unit)}</span></td><td style="color:#dc2626;font-weight:700">${z.short} ${esc(z.unit)}</td><td class="sm">${esc(z.driver)}<br>${esc(z.date)}</td><td>${z.status==="open"?`<span class="st re">⚠ ${t("shortb")}</span>`:`<span class="st ok">✔</span>`}</td></tr>`).join("")}</table>`:t("none")}</div>`}
function stockRows(){const f=(S.q||"").toLowerCase();return items(S.k).filter(i=>!f||i.name.toLowerCase().includes(f)).map(i=>`<tr onclick="itemForm('${i.id}')"><td>${esc(i.name)}<br><span class="sm">${esc(i.cat)}${i.supplier?" · "+esc(i.supplier):""}</span></td><td><b>${qtyOf(i)}</b> ${esc(i.unit)}</td><td>${i.rl}</td><td>${low(i)?`<span class="st re">${t("re")}</span>`:`<span class="st ok">${t("ok")}</span>`}</td></tr>`).join("")||`<tr><td>${t("none")}</td></tr>`}
function itemForm(id){const i=all("i").find(x=>x.id===id)||{};$("#frm").innerHTML=`<div class="card"><label>${t("item")}</label><input id="fn" value="${esc(i.name)}"><label>${t("cat")}</label><select id="fc">${CATS.map(c=>`<option ${c===i.cat?"selected":""}>${c}</option>`).join("")}</select><div class="row"><div><label>${t("unit")}</label><input id="fu" value="${esc(i.unit||"kg")}"></div><div><label>${id?t("qty")+" ("+qtyOf(i)+")":t("qty")}</label><input id="fq" type="number" step="any" ${id?"disabled":""}></div><div><label>${t("rl")}</label><input id="fr" type="number" step="any" value="${i.rl??""}"></div></div><label>${t("sup")}</label><input id="fs" value="${esc(i.supplier)}"><p></p><div class="row"><button onclick="saveItem('${id||""}')">${t("save")}</button>${id?`<button class="red" onclick="if(confirm('?')){put('i','${id}',null,1);render()}">${t("del")}</button>`:""}</div></div>`;$("#frm").scrollIntoView()}
function saveItem(id){const n=$("#fn").value.trim();if(!n)return;const nid=id||uid();put("i",nid,{id:nid,kitchen:S.k,name:n,cat:$("#fc").value,unit:$("#fu").value.trim(),rl:+$("#fr").value||0,supplier:$("#fs").value.trim()});
 const q=+$("#fq").value;if(!id&&q>0){const mid=uid();put("m",mid,{id:mid,type:"in",kitchen:S.k,item:nid,qty:q,at:new Date().toISOString(),by:meU().name,note:"start"})}toast(t("saved"));render()}
function saveMove(){const q=+$("#mq").value,iid=$("#mi").value,ty=(S.k===STORE?["in","xfer"]:["use","xfer"]).includes(S.mt)?S.mt:(S.k===STORE?"in":"use");if(!(q>0))return;const m={id:uid(),type:ty,kitchen:S.k,item:iid,qty:q,at:new Date().toISOString(),by:meU().name,note:$("#mn").value};
 if(ty==="in"&&S.k!==STORE)return;if(ty!=="in"){const it0=all("i").find(i=>i.id===iid);if(q>qtyOf(it0)){toast("⚠️ "+t("toomuch")+" ("+qtyOf(it0)+" "+it0.unit+")");return}}if(ty==="xfer"){const to=$("#mto").value;if(to===S.k)return;const src=all("i").find(i=>i.id===iid);let d=items(to).find(i=>i.name.toLowerCase()===src.name.toLowerCase());if(!d){d={...src,id:uid(),kitchen:to};put("i",d.id,d)}m.to=to;m.toItem=d.id}
 put("m",m.id,m);toast(t("saved"));render()}
function setU(id,st,role){const u=users().find(x=>x.id===id);put("u",id,{...u,status:st,role:role||u.role});render()}
function shareList(){const ks=S.shopK===undefined?S.k:S.shopK,txt="🛒 "+(ks||t("all"))+"\n"+items(ks||null).filter(low).map(i=>`• ${i.name}: ${buyQty(i)} ${i.unit}`+(ks?"":` (${i.kitchen})`)).join("\n");navigator.share?navigator.share({text:txt}).catch(()=>{}):navigator.clipboard?.writeText(txt).then(()=>toast("📋"))}
document.addEventListener("change",e=>{if(e.target.id==="ks"){S.k=localStorage.k=e.target.value;render()}if(e.target.id==="shk"){S.shopK=e.target.value;render()}});
$("#lang").onchange=e=>{L=localStorage.lang=e.target.value;render()};
/* Sync: same protocol as Purshes Code.gs — POST {code,device,since,changes:[{kind,id,u,del,data}]} */
let st;function schedSync(){clearTimeout(st);st=setTimeout(sync,1500)}
async function sync(){const c=S.cfg;if(!c.url||!c.code){$("#dot").className="dot";return}$("#dot").className="dot busy";
 const ch=Object.values(S.recs).filter(r=>r.dirty).map(r=>({kind:r.kind,id:r.id,u:r.u,del:r.del,data:r.data}));
 try{const r=await(await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({code:c.code,device:S.dev,since:c.since||0,changes:ch})})).json();if(!r.ok)throw r.error;
  const tx=db.transaction("r","readwrite").objectStore("r");ch.forEach(x=>{const k=x.kind+":"+x.id;if(S.recs[k]&&S.recs[k].u===x.u){delete S.recs[k].dirty;tx.put(S.recs[k])}});
  (r.records||[]).forEach(x=>{const k=x.kind+":"+x.id,o=S.recs[k];if(o&&o.u>x.u)return;const n={key:k,kind:x.kind,id:x.id,u:x.u,del:x.del,data:typeof x.data==="string"?JSON.parse(x.data):x.data};S.recs[k]=n;tx.put(n)});
  c.since=r.now;localStorage.cfg=JSON.stringify(c);S.last=Date.now();$("#dot").className="dot ok";S.lastRes=r;if(meU())render();return r}catch(e){$("#dot").className="dot err";S.lastErr=String(e);return null}}
/* Auto-update: check on open + daily, apply when idle */
function upd(){navigator.serviceWorker?.getRegistration().then(r=>r&&r.update())}
if("serviceWorker"in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").then(r=>{r.addEventListener("updatefound",()=>{const w=r.installing;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller){toast("⬆️ Update…");let idle;const go=()=>{clearTimeout(idle);idle=setTimeout(()=>w.postMessage("skip"),20000)};["touchstart","keydown"].forEach(e=>addEventListener(e,go));go()}})})});
 let rl;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!rl){rl=1;location.reload()}});setInterval(upd,864e5)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){upd();sync()}});
idb().then(loadAll).then(()=>{render();sync()});
</script></body></html>
