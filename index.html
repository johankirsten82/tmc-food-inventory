const TZ=36e5,chad=ms=>new Date(ms+TZ),ymd=ms=>chad(ms).toISOString().slice(0,10);

const stKey=(ms=Date.now())=>ymd(stSunday(ms)),fmtD=k=>new Date(k+"T12:00:00").toLocaleDateString(L,{weekday:"short",day:"numeric",month:"short"});
const stDoneFor=k=>all("st").some(x=>x.week===k);
const stDue=()=>can("count")&&stockItems().length>0&&!stDoneFor(stKey());
function missedST(){const now=Date.now(),first=Math.min(...all("m").map(m=>Date.parse(m.at)).filter(x=>x),now),out=[];let s=stSunday(now)-7*864e5;
 for(let i=0;i<8;i++,s-=7*864e5){if(s<first-7*864e5)break;const k=ymd(s);if(s>=first&&now>=s+16*36e5&&!stDoneFor(k))out.push(k)}

/* SPELLCHECK START — phone spellcheck on every free-text box (names, items, notes).
   Never on PIN / number / sync / code / masked fields. Covers boxes built later too. */
(function(){
  var SKIP=/pin|url|code|sync|pass|qty|price|amount|num|date|email|phone|tel/i;
  function want(el){
    if(el.hasAttribute("data-nospell")||el.classList.contains("msk")||el.classList.contains("mk")||el.readOnly||(el.getAttribute("autocapitalize")||"")==="characters")return false;
    if(el.tagName==="TEXTAREA")return true;
    var ty=(el.getAttribute("type")||"text").toLowerCase();
    if(ty!=="text"&&ty!=="search")return false;
    var im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im==="numeric"||im==="decimal"||im==="tel"||im==="email"||im==="url")return false;
    if(SKIP.test((el.id||"")+" "+(el.name||"")+" "+(el.className||"")))return false;
    return true;
  }
  function fix(el){
    if(!want(el)){if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){el.spellcheck=false;el.setAttribute("spellcheck","false")}return}
    el.spellcheck=true;el.setAttribute("spellcheck","true");el.setAttribute("autocorrect","on");
    var nm=/name|who/i.test((el.id||"")+" "+(el.name||""))&&el.tagName!=="TEXTAREA";
    el.setAttribute("autocapitalize",nm?"words":"sentences");
  }
  function scan(root){if(!root||!root.querySelectorAll)return;if(root.matches&&root.matches("input,textarea"))fix(root);root.querySelectorAll("input,textarea").forEach(fix)}
  window.TMC_spell=scan;
  function go(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true})}
  if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
})();
/* SPELLCHECK END */
</script></body></html>
